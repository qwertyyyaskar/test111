<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Установка Scarlet</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: #f5f5f7;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px 30px;
            max-width: 400px;
            width: 100%;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
        }
        .icon {
            font-size: 72px;
            margin-bottom: 10px;
        }
        h1 {
            font-size: 28px;
            font-weight: 700;
            margin: 10px 0 5px;
            color: #1c1c1e;
        }
        .version {
            color: #8e8e93;
            font-size: 16px;
            margin-bottom: 25px;
        }
        .install-btn {
            display: inline-block;
            background: #007aff;
            color: white;
            font-size: 20px;
            font-weight: 600;
            padding: 16px 40px;
            border-radius: 14px;
            text-decoration: none;
            transition: background 0.2s;
            width: 100%;
            box-sizing: border-box;
        }
        .install-btn:active {
            background: #0055b3;
        }
        .note {
            margin-top: 20px;
            font-size: 14px;
            color: #8e8e93;
            line-height: 1.5;
        }
        .note a {
            color: #007aff;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">⬇️</div>
        <h1>Scarlet</h1>
        <div class="version">Версия 1.0</div>
        
        <a href="itms-services://?action=download-manifest&url=https://raw.githubusercontent.com/qwertyyyaskar/test111/main/manifest.plist" class="install-btn">
            Установить
        </a>
        
        <div class="note">
            Нажмите «Установить», затем подтвердите установку<br>
            <small>Если приложение не появляется — проверьте, что файлы загружены на GitHub</small>
        </div>
    </div>
</body>
</html>
